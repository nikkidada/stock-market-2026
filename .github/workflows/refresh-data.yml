name: Refresh Market Data

on:
  schedule:
    # 每个交易日北京时间 09:00 后（UTC 01:00）自动更新
    - cron: "0 1 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch market data (pure stdlib, no deps)
        run: python fetch_data.py

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json data.js
          if git diff --cached --quiet; then
            echo "No data change, skip commit"
          else
            git commit -m "chore: refresh market data $(date -u +'%Y-%m-%d')"
            # 避免与并发提交冲突: 先 rebase 再推送
            git pull --rebase origin main || { echo "rebase failed"; exit 1; }
            git push
          fi
